<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MãoAobra V3 - O seu marketplace de serviços</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind Config for iFood-like Theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ea1d2c',
                        primaryDark: '#b31520',
                        secondary: '#f7f7f7',
                        dark: '#3e3e3e',
                        light: '#ffffff',
                        muted: '#717171',
                        success: '#50a773',
                        warning: '#f4a62a'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            color: #1F2937;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Minimalist Transitions */
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-down {
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideDown {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOXqP8I7__A6PSuwK2CrrbP7Ml2fUr_pA",
            authDomain: "maoaobra-51218.firebaseapp.com",
            projectId: "maoaobra-51218",
            storageBucket: "maoaobra-51218.firebasestorage.app",
            messagingSenderId: "658075256499",
            appId: "1:658075256499:web:f4ed19490baae47f1152c6",
            measurementId: "G-QECTXJCJ6M"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Export para o Babel/React acessar
        window.FirebaseDB = db;
        window.FirebaseDoc = doc;
        window.FirebaseSetDoc = setDoc;
        window.FirebaseOnSnapshot = onSnapshot;
    </script>

    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, createContext, useContext, useMemo } = React;

        // ==========================================
        // 1. MOCK DATA & ESTADO GLOBAL E UTILIDADES
        // ==========================================

        const calculateRating = (reviewsList) => {
            if (!reviewsList || reviewsList.length === 0) return 0;
            return (reviewsList.reduce((a, b) => a + b.nota, 0) / reviewsList.length).toFixed(1);
        };

        const usePersistentState = (key, initialValue) => {
            const [state, setState] = React.useState(initialValue);
            const [loaded, setLoaded] = React.useState(false);

            React.useEffect(() => {
                if(!window.FirebaseDB) return;
                const docRef = window.FirebaseDoc(window.FirebaseDB, "appData", key);
                const unsubscribe = window.FirebaseOnSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        setState(docSnap.data().value);
                    } else {
                        window.FirebaseSetDoc(docRef, { value: initialValue });
                        setState(initialValue);
                    }
                    setLoaded(true);
                });
                return () => unsubscribe();
            }, [key]);

            const setPersistentState = (newValue) => {
                setState(newValue); // Optimistic Update
                if(window.FirebaseDB) window.FirebaseSetDoc(window.FirebaseDoc(window.FirebaseDB, "appData", key), { value: newValue });
            };

            return [state, setPersistentState, loaded];
        };

        const INITIAL_USERS = [
            { id: 'a1', nome: 'Administrador', email: 'legalmano@gmail.com', senha: '123', role: 'ADMIN', foto_perfil_url: 'https://ui-avatars.com/api/?name=Admin&background=ea1d2c&color=fff', telefone: '00000000000', data_criacao: new Date().toISOString(), status: 'APPROVED' },
            { id: 'w1', nome: 'Allan Eletricista', email: 'allan@gmail.com', senha: '123', role: 'TRABALHADOR', foto_perfil_url: 'https://ui-avatars.com/api/?name=Allan+Eletricista&background=007bff&color=fff', telefone: '(11) 98888-7777', data_criacao: new Date().toISOString(), status: 'APPROVED' },
            { id: 'c1', nome: 'Vinicius Cliente', email: 'vini@gmail.com', senha: '123', role: 'CONTRATANTE', foto_perfil_url: 'https://ui-avatars.com/api/?name=Vinicius&background=6f42c1&color=fff', telefone: '(11) 99999-1111', data_criacao: new Date().toISOString(), status: 'APPROVED' }
        ];

        const INITIAL_WORKER_DETAILS = [
            { user_id: 'w1', bio: 'Especialista em instalações elétricas residenciais e comerciais. Mais de 10 anos de experiência.', categorias: ['Eletricista'], nota_media: 4.9, portfolio_fotos: [], cpf: '123.456.789-00', cep: '01001-000', rua: 'Rua Direita', numero: '100', bairro: 'Centro', uf: 'SP', isOnline: true, workingHours: 'Seg-Sex, 08:00 as 18:00' }
        ];

        const INITIAL_CONTRATANTE_DETAILS = [
            { user_id: 'c1', cpf: '987.654.321-00', cep: '01002-000', rua: 'Avenida Paulista', numero: '1000', bairro: 'Bela Vista', uf: 'SP' }
        ];

        const INITIAL_SERVICES = [
            { id: 's1', worker_id: 'w1', titulo: 'Instalação de Chuveiro', descricao: 'Instalação completa de chuveiro elétrico com fiação dedicada.', preco_base: 80, tempo_estimado: '1h' },
            { id: 's2', worker_id: 'w1', titulo: 'Manutenção de Quadro de Luz', descricao: 'Revisão de disjuntores e fiação do quadro principal.', preco_base: 150, tempo_estimado: '2h' }
        ];

        const AppContext = React.createContext();

        const AppProvider = ({ children }) => {
            const [users, setUsers, uLoaded] = usePersistentState('maos_v5_users', INITIAL_USERS);
            const [workerDetails, setWorkerDetails, wLoaded] = usePersistentState('maos_v5_worker_details', INITIAL_WORKER_DETAILS);
            const [contratanteDetails, setContratanteDetails, cLoaded] = usePersistentState('maos_v5_contratante_details', INITIAL_CONTRATANTE_DETAILS);
            const [services, setServices, sLoaded] = usePersistentState('maos_v5_services', INITIAL_SERVICES);
            const [orders, setOrders, oLoaded] = usePersistentState('maos_v5_orders', []);
            const [reviews, setReviews, rLoaded] = usePersistentState('maos_v5_reviews', []);
            const [supportTickets, setSupportTickets, tLoaded] = usePersistentState('maos_v5_support_tickets', []);

            const allLoaded = uLoaded && wLoaded && cLoaded && sLoaded && oLoaded && rLoaded && tLoaded;

            const [currentUser, setCurrentUser] = React.useState(null);
            const [currentView, _setCurrentView] = React.useState('HOME');
            const [toast, setToast] = React.useState(null);
            const [selectedWorkerId, _setSelectedWorkerId] = React.useState(null);
            const [selectedClientId, _setSelectedClientId] = React.useState(null);

            const pushState = (stateObj) => {
                window.history.pushState(stateObj, '', window.location.pathname);
            };

            const setCurrentView = (view) => {
                _setCurrentView(view);
                _setSelectedWorkerId(null);
                _setSelectedClientId(null);
                pushState({ currentView: view, selectedWorkerId: null, selectedClientId: null });
            };

            const setSelectedWorkerId = (id) => {
                _setSelectedWorkerId(id);
                pushState({ currentView, selectedWorkerId: id, selectedClientId: null });
            };

            const setSelectedClientId = (id) => {
                _setSelectedClientId(id);
                pushState({ currentView, selectedWorkerId: null, selectedClientId: id });
            };

            React.useEffect(() => {
                const handlePopState = (event) => {
                    if (event.state) {
                        _setCurrentView(event.state.currentView || 'HOME');
                        _setSelectedWorkerId(event.state.selectedWorkerId || null);
                        _setSelectedClientId(event.state.selectedClientId || null);
                    } else {
                        _setCurrentView('HOME');
                        _setSelectedWorkerId(null);
                        _setSelectedClientId(null);
                    }
                };
                window.addEventListener('popstate', handlePopState);
                window.history.replaceState({ currentView: 'HOME', selectedWorkerId: null, selectedClientId: null }, '', window.location.pathname);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            if (!allLoaded) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-gray-50 animate-fade-in">
                        <div className="animate-spin w-16 h-16 border-4 border-primary border-t-transparent rounded-full mb-4"></div>
                        <h2 className="text-xl font-extrabold text-dark animate-pulse">Conectando ao Firebase...</h2>
                    </div>
                );
            }

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            const login = (email, senha) => {
                const user = users.find(u => u.email === email && u.senha === senha);
                if (user) {
                    if (user.role === 'TRABALHADOR' && user.status === 'PENDING') {
                        showToast('Sua conta ainda está em análise pelo administrador. Aguarde a aprovação para acessar.', 'warning');
                        return false;
                    }
                    setCurrentUser(user);
                    if (user.role === 'ADMIN') setCurrentView('ADMIN_DASH');
                    else if (user.role === 'CONTRATANTE') setCurrentView('HOME');
                    else setCurrentView('WORKER_DASH');
                    showToast(`Bem-vindo, ${user.nome.split(' ')[0]}!`);
                    return true;
                }
                showToast('Credenciais inválidas!', 'error');
                return false;
            };

            const logout = () => {
                setCurrentUser(null);
                setCurrentView('HOME');
                showToast('Você saiu da conta.');
            };

            const register = (userData, specificData) => {
                const status = userData.role === 'TRABALHADOR' ? 'PENDING' : 'APPROVED';
                const newUser = { ...userData, id: 'u' + Date.now(), data_criacao: new Date().toISOString(), status };
                setUsers([...users, newUser]);

                if (newUser.role === 'CONTRATANTE') {
                    setContratanteDetails([...contratanteDetails, { user_id: newUser.id, ...specificData, total_pedidos: 0 }]);
                    setCurrentUser(newUser);
                    setCurrentView('HOME');
                    showToast('Conta de cliente criada com sucesso!');
                } else {
                    setWorkerDetails([...workerDetails, { user_id: newUser.id, ...specificData, nota_media: 0, portfolio_fotos: [], isOnline: true, workingHours: 'A combinar' }]);
                    setCurrentView('LOGIN');
                    showToast('Cadastro enviado para aprovação! Entraremos em contato em breve.', 'info');
                }
            };

            const approveWorker = (id) => {
                setUsers(users.map(u => u.id === id ? { ...u, status: 'APPROVED' } : u));
                showToast('Profissional aprovado com sucesso!');
            };

            const rejectWorker = (id) => {
                setUsers(users.filter(u => u.id !== id));
                setWorkerDetails(workerDetails.filter(w => w.user_id !== id));
                showToast('Cadastro recusado e excluído.');
            };

            return (
                <AppContext.Provider value={{
                    users, workerDetails, contratanteDetails, services, reviews, orders, supportTickets,
                    currentUser, currentView, setCurrentView, login, logout, register,
                    setOrders, setServices, approveWorker, rejectWorker, setWorkerDetails,
                    toast, showToast, setUsers, setContratanteDetails, setCurrentUser, setReviews,
                    selectedWorkerId, setSelectedWorkerId, selectedClientId, setSelectedClientId,
                    setSupportTickets
                }}>
                    {children}
                </AppContext.Provider>
            );
        };

        const useAppStore = () => React.useContext(AppContext);

        // ==========================================
        // 2. COMPONENTES COMPARTILHADOS (UI & LAYOUT)
        // ==========================================
        const ToastNotification = () => {
            const { toast } = useAppStore();
            if (!toast) return null;

            const isError = toast.type === 'error';
            const isWarning = toast.type === 'warning';

            let bgClass = 'bg-green-600';
            let icon = 'ph-check-circle';

            if (isError) { bgClass = 'bg-red-600'; icon = 'ph-warning-circle'; }
            if (isWarning) { bgClass = 'bg-orange-500'; icon = 'ph-info'; }
            if (toast.type === 'info') { bgClass = 'bg-blue-500'; icon = 'ph-info'; }

            return (
                <div className="fixed top-4 left-0 right-0 z-[9999] flex justify-center pointer-events-none px-4">
                    <div className={`px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 animate-slide-down text-white font-bold max-w-md w-full md:w-auto pointer-events-auto ${bgClass}`}>
                        <i className={`ph-bold ${icon} text-2xl`}></i>
                        <p className="text-sm">{toast.message}</p>
                    </div>
                </div>
            );
        };

        const NavBar = ({ role }) => {
            const { currentView, setCurrentView, currentUser, orders } = useAppStore();

            const hasUnreadMessages = React.useMemo(() => {
                if (!currentUser) return false;
                return orders.some(o => {
                    const isParticipant = o.contratante_id === currentUser.id || o.worker_id === currentUser.id;
                    const isActive = ['PENDENTE', 'ACEITO', 'EM_ANDAMENTO'].includes(o.status);
                    if (isParticipant && isActive && o.chat_history && o.chat_history.length > 0) {
                        const lastMsg = o.chat_history[o.chat_history.length - 1];
                        const senderId = lastMsg.sender || lastMsg.remetente_id;
                        return senderId !== currentUser.id;
                    }
                    return false;
                });
            }, [currentUser, orders]);

            let links = [];
            if (role === 'CONTRATANTE') {
                links = [
                    { id: 'HOME', icon: 'ph-house', label: 'Início' },
                    { id: 'ORDERS', icon: 'ph-receipt', label: 'Pedidos' },
                    { id: 'PROFILE', icon: 'ph-user', label: 'Perfil' }
                ];
            } else if (role === 'TRABALHADOR') {
                links = [
                    { id: 'WORKER_DASH', icon: 'ph-chart-line-up', label: 'Painel' },
                    { id: 'WORKER_SERVICES', icon: 'ph-wrench', label: 'Serviços' },
                    { id: 'WORKER_HISTORY', icon: 'ph-clock-counter-clockwise', label: 'Histórico' },
                    { id: 'WORKER_PROFILE', icon: 'ph-user-circle', label: 'Meu Perfil' }
                ];
            } else if (role === 'ADMIN') {
                links = [
                    { id: 'ADMIN_DASH', icon: 'ph-chart-bar', label: 'Visão Geral' },
                    { id: 'ADMIN_CLIENTS', icon: 'ph-users', label: 'Clientes' },
                    { id: 'ADMIN_WORKERS', icon: 'ph-briefcase', label: 'Profissionais' },
                    { id: 'ADMIN_APPROVALS', icon: 'ph-clock-countdown', label: 'Aprovações' },
                    { id: 'ADMIN_SUPPORT', icon: 'ph-headset', label: 'Suporte' },
                    { id: 'ADMIN_CHATS', icon: 'ph-chats', label: 'Monitoramento' }
                ];
            }

            const renderDesktopLink = (link) => {
                const isActive = currentView === link.id;
                const showBadge = (link.id === 'ORDERS' || link.id === 'WORKER_DASH') && hasUnreadMessages;
                return (
                    <button key={link.id} onClick={() => setCurrentView(link.id)} className={`relative flex items-center gap-2 px-4 py-2 rounded-xl transition-all font-bold text-sm ${isActive ? 'bg-red-50 text-primary' : 'text-gray-600 hover:bg-gray-100 hover:text-dark'}`}>
                        <div className="relative">
                            <i className={`text-xl ${isActive ? 'ph-fill' : 'ph-bold'} ${link.icon}`}></i>
                            {showBadge && <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white animate-pulse"></span>}
                        </div>
                        {link.label}
                    </button>
                )
            };

            const renderMobileLink = (link) => {
                const isActive = currentView === link.id;
                const showBadge = (link.id === 'ORDERS' || link.id === 'WORKER_DASH') && hasUnreadMessages;
                return (
                    <button key={link.id} onClick={() => setCurrentView(link.id)} className={`relative flex flex-col items-center gap-0.5 transition-all ${isActive ? 'text-primary' : 'text-gray-400'}`}>
                        <div className="relative">
                            <i className={`text-xl ${isActive ? 'ph-fill' : 'ph'} ${link.icon}`}></i>
                            {showBadge && <span className="absolute -top-0.5 -right-0.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white animate-pulse"></span>}
                        </div>
                        <span className="text-[9px] font-bold">{link.label}</span>
                    </button>
                )
            };

            return (
                <>
                    {/* Desktop Top Navbar */}
                    <header className="hidden md:flex fixed top-0 w-full bg-white border-b border-gray-200 z-50 h-20 px-8 items-center justify-between shadow-sm">
                        <div className="text-primary font-extrabold text-2xl select-none flex items-center gap-2 cursor-pointer" onClick={() => setCurrentView(role === 'ADMIN' ? 'ADMIN_DASH' : 'HOME')}>
                            <i className="ph-fill ph-wrench text-3xl"></i>
                            <span><span className="text-dark">mão</span><span className="text-primary">A</span><span className="text-dark">obra</span></span>
                        </div>
                        <nav className="flex gap-2">
                            {links.map(renderDesktopLink)}
                        </nav>
                    </header>

                    {/* Mobile Bottom Navbar */}
                    <nav className="md:hidden fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around pt-2 pb-4 z-50 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
                        {links.map(renderMobileLink)}
                    </nav>
                </>
            );
        };

        const Header = ({ title, showBack, onBack }) => (
            <div className="glass-header sticky top-0 md:top-20 z-40 px-4 md:px-8 py-4 md:py-6 flex items-center border-b border-gray-100 mb-6">
                {showBack && (
                    <button onClick={onBack} className="mr-4 text-primary p-2 bg-red-50 rounded-full hover:bg-red-100 transition-colors">
                        <i className="ph-bold ph-arrow-left text-xl"></i>
                    </button>
                )}
                <h1 className="font-extrabold text-2xl text-dark flex-1">{title}</h1>
            </div>
        );

        const StarRating = ({ rating }) => {
            const stars = [];
            for (let i = 1; i <= 5; i++) {
                if (i <= Math.floor(rating)) stars.push(<i key={i} className="ph-fill ph-star text-warning"></i>);
                else if (i === Math.ceil(rating) && !Number.isInteger(rating)) stars.push(<i key={i} className="ph-fill ph-star-half text-warning"></i>);
                else stars.push(<i key={i} className="ph ph-star text-gray-300"></i>);
            }
            return <div className="flex text-sm">{stars}</div>;
        };
        const OrderChatModal = ({ order, onClose }) => {
            if (!order) return null;
            const { users, currentUser, setOrders, orders, services, showToast, setSelectedWorkerId } = useAppStore();
            const [message, setMessage] = React.useState('');
            const [imageUrl, setImageUrl] = React.useState('');
            const chatRef = React.useRef(null);

            const client = users.find(u => u.id === order.contratante_id);
            const worker = users.find(u => u.id === order.worker_id);
            const srv = services.find(s => s.id === order.servico_id);
            const otherUser = currentUser.role === 'CONTRATANTE' ? worker : client;

            React.useEffect(() => {
                if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
            }, [order.chat_history]);

            const handleSend = (e) => {
                e.preventDefault();
                if (!message.trim() && !imageUrl.trim()) return;
                const newMessage = { sender: currentUser.id, text: message, image: imageUrl, time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) };
                const newHistory = [...(order.chat_history || []), newMessage];
                setOrders(orders.map(o => o.id === order.id ? { ...o, chat_history: newHistory } : o));
                setMessage('');
                setImageUrl('');
            };

            const updateStatus = (newStatus) => {
                setOrders(orders.map(o => o.id === order.id ? { ...o, status: newStatus } : o));
                showToast(`Pedido atualizado para: ${newStatus}`);
                if (['RECUSADO'].includes(newStatus)) onClose();
            };

            return ReactDOM.createPortal(
                <div className="fixed inset-0 bg-dark/80 backdrop-blur-sm z-[99999] flex flex-col md:p-10 animate-fade-in">
                    <div className="bg-gray-50 flex-1 md:rounded-3xl shadow-2xl flex flex-col overflow-hidden max-w-4xl w-full mx-auto animate-slide-down relative">
                        <div className="bg-white border-b border-gray-100 p-4 flex items-center justify-between shadow-sm z-10">
                            <div className="flex items-center gap-3 cursor-pointer group" onClick={() => {
                                onClose();
                                if (currentUser.role === 'CONTRATANTE') {
                                    setSelectedWorkerId(otherUser.id);
                                } else {
                                    setSelectedClientId(otherUser.id);
                                }
                            }}>
                                <img src={otherUser?.foto_perfil_url} className="w-12 h-12 rounded-full border-2 border-primary object-cover group-hover:scale-105 transition" />
                                <div>
                                    <h3 className="font-extrabold text-dark group-hover:text-primary transition">{otherUser?.nome}</h3>
                                    <p className="text-xs text-primary font-bold">{srv?.titulo || 'Serviço Personalizado'}</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="w-10 h-10 bg-gray-50 hover:bg-red-50 hover:text-red-600 rounded-full flex items-center justify-center text-dark transition"><i className="ph-bold ph-x text-xl"></i></button>
                        </div>

                        <div className="bg-orange-50 p-3 border-b border-orange-100 flex items-center justify-between text-sm">
                            <div><span className="font-extrabold text-orange-800">Status:</span> <span className="font-bold text-orange-600">{order.status}</span></div>
                            <div className="font-extrabold text-primary">R$ {order.preco_final}</div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50" ref={chatRef}>
                            {(order.chat_history || []).map((msg, i) => {
                                const isMe = msg.sender === currentUser.id;
                                return (
                                    <div key={i} className={`flex ${isMe ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[85%] md:max-w-[70%] rounded-2xl p-3 ${isMe ? 'bg-primary text-white rounded-tr-none' : 'bg-white border border-gray-200 text-dark rounded-tl-none shadow-sm'}`}>
                                            {msg.image && <img src={msg.image} className="max-w-full rounded-xl mb-2 object-cover max-h-64 border border-white/20" alt="anexo" />}
                                            {msg.text && <p className="text-sm font-medium whitespace-pre-wrap">{msg.text}</p>}

                                        if(!currentUser) { showToast("Por favor, faça login.", "warning"); setCurrentView('LOGIN'); }

                                        else { setIsRequestModalOpen(true); }

                                        Solicitar Orçamento

                                        <i className="ph-fill ph-whatsapp-logo text-2xl"></i> Mensagem WhatsApp

                            else { setIsRequestModalOpen(true); }
                        }} className="flex-1 bg-primary text-white font-extrabold rounded-2xl shadow-lg shadow-primary/30 flex items-center justify-center gap-2">

        }

        const AdminWorkers = () => {
            const { users } = useAppStore();
            const workers = users.filter(u => u.role === 'TRABALHADOR' && u.status === 'APPROVED');
            return <AdminListLayout title="Profissionais Aprovados" usersList={workers} />;
        }

        const AdminApprovals = () => {
            const { users, workerDetails, approveWorker, rejectWorker } = useAppStore();
            const pending = users.filter(u => u.role === 'TRABALHADOR' && u.status === 'PENDING');

            return (
                <div className="pb-24 animate-fade-in w-full">
                    <Header title="Aprovações Pendentes" />
                    <div className="p-4 md:p-8 space-y-6 max-w-5xl mx-auto">
                        {pending.length === 0 ? (
                            <div className="col-span-full text-center text-gray-500 mt-10 p-12 bg-white rounded-3xl border border-gray-100 shadow-sm max-w-xl mx-auto">
                                <i className="ph-fill ph-check-circle text-6xl mb-4 text-green-500"></i>
                                <h3 className="text-2xl font-extrabold text-dark mb-2">Tudo em dia!</h3>
                                <p className="font-medium text-gray-500">Nenhuma solicitação de cadastro pendente no momento.</p>
                            </div>
                        ) : pending.map(w => {
                            const details = workerDetails.find(d => d.user_id === w.id);
                            return (
                                <div key={w.id} className="bg-white p-6 md:p-8 rounded-3xl shadow-md border border-gray-100 relative overflow-hidden flex flex-col md:flex-row gap-8 hover:shadow-lg transition">
                                    <div className="absolute top-0 right-0 bg-orange-500 text-white text-xs font-extrabold px-4 py-1.5 rounded-bl-xl shadow-sm">REVISÃO NECESSÁRIA</div>

                                    <div className="flex-shrink-0 flex flex-col items-center gap-3">
                                        <img src={w.foto_perfil_url} className="w-24 h-24 rounded-full border-4 border-gray-50 shadow-sm" />
                                        <span className="bg-primary/10 text-primary px-3 py-1 rounded-lg text-xs font-extrabold uppercase tracking-widest">{details?.categorias[0]}</span>
                                    </div>

                                    <div className="flex-1">
                                        <h3 className="text-2xl font-extrabold text-dark mb-4">{w.nome}</h3>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                                            <div className="bg-gray-50 p-3 rounded-xl border border-gray-100">
                                                <p className="text-[10px] font-extrabold text-gray-400 uppercase mb-1">Contato</p>
                                                <p className="text-sm font-bold text-dark"><i className="ph-fill ph-envelope-simple text-primary"></i> {w.email}</p>
                                                <p className="text-sm font-bold text-dark mt-1"><i className="ph-fill ph-phone text-primary"></i> {w.telefone}</p>
                                            </div>
                                            <div className="bg-gray-50 p-3 rounded-xl border border-gray-100">
                                                <p className="text-[10px] font-extrabold text-gray-400 uppercase mb-1">Documento</p>
                                                <p className="text-sm font-bold text-dark"><i className="ph-fill ph-identification-card text-primary"></i> CPF: {details?.cpf}</p>
                                            </div>
                                        </div>

                                        <div className="bg-gray-50 p-4 rounded-xl border border-gray-100 mb-6">
                                            <p className="text-[10px] font-extrabold text-gray-400 uppercase mb-2">Endereço Fornecido</p>
                                            <p className="text-sm font-bold text-dark">{details?.rua}, {details?.numero} - {details?.bairro}, {details?.uf} - {details?.cep}</p>
                                        </div>

                                        <div className="bg-blue-50 p-4 rounded-xl border border-blue-100 mb-6 relative">
                                            <i className="ph-fill ph-quotes absolute -top-3 -left-2 text-3xl text-blue-200"></i>
                                            <p className="text-[10px] font-extrabold text-blue-800 uppercase mb-2">Carta de Apresentação</p>
                                            <p className="text-sm text-blue-900 italic font-medium">"{details?.bio}"</p>
                                        </div>

                                        <div className="flex flex-col sm:flex-row gap-3">
                                            <button onClick={() => { if (window.confirm('Tem certeza que deseja recusar e excluir este cadastro?')) rejectWorker(w.id); }} className="flex-1 bg-red-50 text-red-600 font-extrabold py-3.5 rounded-xl hover:bg-red-100 transition border border-red-200 shadow-sm">Recusar Cadastro</button>
                                            <button onClick={() => { if (window.confirm('Aprovar trabalhador? Ele receberá acesso imediato à plataforma.')) approveWorker(w.id); }} className="flex-1 bg-green-500 text-white font-extrabold py-3.5 rounded-xl shadow-lg shadow-green-500/30 hover:bg-green-600 transition transform hover:-translate-y-1">Aprovar e Liberar Acesso</button>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const AdminSupport = () => {
            const { supportTickets, setSupportTickets, users } = useAppStore();
            const [replyMsg, setReplyMsg] = useState({});
            const [activeTicketId, setActiveTicketId] = useState(null);

            const handleReply = (ticketId) => {
                if(!replyMsg[ticketId]) return;
                const newMsg = { sender: 'ADMIN', text: replyMsg[ticketId], time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) };
                setSupportTickets(supportTickets.map(t => t.id === ticketId ? { ...t, messages: [...t.messages, newMsg] } : t));
                setReplyMsg({...replyMsg, [ticketId]: ''});
            };

            const closeTicket = (ticketId) => {
                setSupportTickets(supportTickets.map(t => t.id === ticketId ? { ...t, status: 'CLOSED' } : t));
                setActiveTicketId(null);
            };

            const openTickets = supportTickets.filter(t => t.status === 'OPEN');

            return (
                <div className="pb-24 animate-fade-in w-full max-w-5xl mx-auto">
                    <Header title={activeTicketId ? "Chat de Suporte" : "Suporte Central (Admin)"} showBack={!!activeTicketId} onBack={() => setActiveTicketId(null)} />
                    <div className="px-4 md:px-8 space-y-6">
                        {!activeTicketId ? (
                            <>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {openTickets.map(t => {
                                        const u = users.find(x => x.id === t.user_id);
                                        const lastMsg = t.messages[t.messages.length - 1];
                                        return (
                                            <div key={t.id} className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 flex flex-col hover:shadow-md transition">
                                                <div className="flex items-center gap-3 mb-4 border-b border-gray-100 pb-4">
                                                    <div className="w-10 h-10 bg-primary/10 text-primary rounded-full flex items-center justify-center shrink-0"><i className="ph-fill ph-headset text-xl"></i></div>
                                                    <div>
                                                        <h4 className="font-extrabold text-dark">{u?.nome}</h4>
                                                        <p className="text-[10px] text-gray-500 font-bold truncate">ID: {t.id}</p>
                                                    </div>
                                                </div>
                                                <div className="flex-1 mb-4">
                                                    <p className="text-xs text-gray-400 font-extrabold uppercase mb-1">Última Mensagem</p>
                                                    <p className="text-sm text-gray-600 line-clamp-2 italic font-medium">"{lastMsg?.text}"</p>
                                                </div>
                                                <button onClick={() => setActiveTicketId(t.id)} className="w-full bg-primary/10 text-primary font-extrabold py-3 rounded-xl hover:bg-primary hover:text-white transition flex items-center justify-center gap-2">
                                                    <i className="ph-bold ph-chat-teardrop-text"></i> Abrir Chat do Ticket
                                                </button>
                                            </div>
                                        )
                                    })}
                                </div>
                                {openTickets.length === 0 && (
                                    <div className="text-center p-10 bg-white rounded-3xl border border-gray-100 shadow-sm">
                                        <i className="ph-fill ph-check-circle text-5xl text-green-500 mb-2"></i>
                                        <h3 className="font-extrabold text-lg text-dark">Nenhum ticket aberto</h3>
                                        <p className="text-gray-500 text-sm font-medium">Todos os usuários foram atendidos no momento.</p>
                                    </div>
                                )}
                            </>
                        ) : (
                            // View do Chat
                            openTickets.filter(t => t.id === activeTicketId).map(t => {
                                const u = users.find(x => x.id === t.user_id);
                                return (
                                    <div key={t.id} className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 flex flex-col animate-fade-in">
                                        <div className="flex justify-between items-center mb-4 border-b border-gray-100 pb-4">
                                            <div className="flex items-center gap-3">
                                                <img src={u?.foto_perfil_url || 'https://ui-avatars.com/api/?name=User'} className="w-10 h-10 rounded-full object-cover" />
                                                <div>
                                                    <h4 className="font-extrabold text-dark">{u?.nome}</h4>
                                                    <p className="text-xs text-gray-500 font-bold">{u?.email}</p>
                                                </div>
                                            </div>
                                            <button onClick={() => { if(window.confirm('Tem certeza que deseja encerrar este ticket?')) closeTicket(t.id); }} className="bg-red-50 text-red-600 px-3 py-2 rounded-xl text-xs font-bold hover:bg-red-100 transition border border-red-100 flex items-center gap-1">
                                                <i className="ph-bold ph-x-circle"></i> Encerrar
                                            </button>
                                        </div>
                                        <div className="bg-gray-50 h-80 overflow-y-auto p-4 rounded-xl mb-4 space-y-3">
                                            {t.messages.map((msg, i) => (
                                                <div key={i} className={`flex items-start gap-2 ${msg.sender === 'ADMIN' ? 'justify-end' : ''}`}>
                                                    <div className={`p-3 rounded-2xl text-sm shadow-sm ${msg.sender === 'ADMIN' ? 'bg-primary text-white rounded-tr-none' : 'bg-white border border-gray-200 text-dark rounded-tl-none'}`}>
                                                        <p className="font-medium whitespace-pre-wrap">{msg.text}</p>
                                                        <div className={`text-[10px] mt-1 text-right ${msg.sender === 'ADMIN' ? 'text-white/70' : 'text-gray-400'}`}>{msg.time}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex gap-2">
                                            <input type="text" value={replyMsg[t.id] || ''} onChange={e => setReplyMsg({...replyMsg, [t.id]: e.target.value})} onKeyDown={e => e.key === 'Enter' && handleReply(t.id)} placeholder="Responder ao usuário..." className="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:border-primary font-medium" />
                                            <button onClick={() => handleReply(t.id)} className="px-6 rounded-xl bg-primary text-white font-bold hover:bg-primaryDark transition shadow-md shadow-primary/20 flex items-center gap-2">
                                                <i className="ph-bold ph-paper-plane-right"></i> Responder
                                            </button>
                                        </div>
                                    </div>
                                )
                            })
                        )}
                    </div>
                </div>
            );
        };

        const AdminChats = () => {
            const { orders, users, services } = useAppStore();
            const activeChats = orders.filter(o => o.chat_history && o.chat_history.length > 0 && ['PENDENTE', 'ACEITO', 'EM_ANDAMENTO'].includes(o.status));

            return (
                <div className="pb-24 animate-fade-in w-full max-w-5xl mx-auto">
                    <Header title="Monitoramento de Chats" />
                    <div className="px-4 md:px-8 space-y-6">
                        {activeChats.map(o => {
                            const worker = users.find(u => u.id === o.worker_id);
                            const client = users.find(u => u.id === o.contratante_id);
                            const srv = services.find(s => s.id === o.servico_id);
                            
                            return (
                                <div key={o.id} className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
                                    <div className="flex justify-between items-center mb-4 pb-4 border-b border-gray-100">
                                        <div>
                                            <h4 className="font-extrabold text-dark text-lg">Pedido: {srv?.titulo || 'Personalizado'}</h4>
                                            <p className="text-sm font-bold text-gray-500">Trabalhador: <span className="text-primary">{worker?.nome}</span> | Cliente: <span className="text-primary">{client?.nome}</span></p>
                                        </div>
                                        <span className="bg-orange-50 text-orange-600 px-3 py-1 rounded-lg text-xs font-bold border border-orange-100">Status: {o.status}</span>
                                    </div>
                                    <div className="bg-gray-50 h-80 overflow-y-auto p-4 rounded-xl space-y-3">
                                        {o.chat_history.map((msg, i) => {
                                            const senderUser = msg.sender === worker?.id ? worker : (msg.sender === client?.id ? client : null);
                                            const isWorker = msg.sender === worker?.id;
                                            return (
                                                <div key={i} className={`flex items-start gap-2 ${isWorker ? 'justify-end' : ''}`}>
                                                    <div className={`p-3 rounded-2xl text-sm shadow-sm max-w-[80%] ${isWorker ? 'bg-primary text-white rounded-tr-none' : 'bg-white border border-gray-200 text-dark rounded-tl-none'}`}>
                                                        <p className={`text-[10px] font-extrabold mb-1 ${isWorker ? 'text-white/80' : 'text-primary'}`}>{senderUser?.nome || 'Usuário'}</p>
                                                        {msg.image && <img src={msg.image} className="max-w-full rounded-xl mb-2 object-cover max-h-48 border border-white/20" alt="anexo" />}
                                                        {msg.text && <p className="whitespace-pre-wrap font-medium">{msg.text}</p>}
                                                        <div className={`text-[10px] mt-1 text-right ${isWorker ? 'text-white/70' : 'text-gray-400'}`}>{msg.time}</div>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            )
                        })}
                        {activeChats.length === 0 && (
                            <div className="text-center p-10 bg-white rounded-3xl border border-gray-100 shadow-sm">
                                <i className="ph-fill ph-chats-teardrop text-5xl text-gray-300 mb-2"></i>
                                <h3 className="font-extrabold text-lg text-dark">Nenhum chat ativo</h3>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const SupportWidget = () => {
            const { currentUser, currentView, supportTickets, setSupportTickets, showToast } = useAppStore();
            const [isOpen, setIsOpen] = useState(false);
            const [message, setMessage] = useState('');
            const chatRef = React.useRef(null);

            const myTicket = currentUser ? supportTickets.find(t => t.user_id === currentUser.id) : null;

            React.useEffect(() => {
                if (isOpen && chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
            }, [isOpen, myTicket?.messages]);

            if(currentView === 'ADMIN_DASH' || currentView === 'ADMIN_CLIENTS' || currentView === 'ADMIN_WORKERS' || currentView === 'ADMIN_APPROVALS' || currentView === 'ADMIN_SUPPORT' || currentView === 'ADMIN_CHATS') return null;

            const handleSend = () => {
                if (!message.trim()) return;
                if (!currentUser) {
                    showToast("Por favor, faça login para usar o suporte.", "warning");
                    return;
                }

                const newMsg = { sender: 'USER', text: message, time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) };
                
                if (myTicket) {
                    setSupportTickets(supportTickets.map(t => t.id === myTicket.id ? { ...t, messages: [...t.messages, newMsg] } : t));
                } else {
                    setSupportTickets([...supportTickets, { id: 't' + Date.now(), user_id: currentUser.id, status: 'OPEN', messages: [newMsg] }]);
                }
                setMessage('');
            };

            return (
                <div className="fixed bottom-24 md:bottom-6 right-6 z-[9999]">
                    {isOpen ? (
                        <div className="bg-white w-80 rounded-3xl shadow-2xl border border-gray-100 flex flex-col overflow-hidden animate-slide-down h-96">
                            <div className="bg-primary p-4 flex justify-between items-center text-white">
                                <div className="flex items-center gap-2">
                                    <i className="ph-fill ph-headset text-2xl"></i>
                                    <h4 className="font-extrabold text-sm">Suporte Central</h4>
                                </div>
                                <button onClick={() => setIsOpen(false)} className="text-white hover:text-gray-200 transition"><i className="ph-bold ph-x text-lg"></i></button>
                            </div>
                            <div className="flex-1 bg-gray-50 p-4 overflow-y-auto flex flex-col gap-3" ref={chatRef}>
                                <div className="flex items-start gap-2">
                                    <div className="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white shrink-0"><i className="ph-bold ph-robot"></i></div>
                                    <div className="bg-white border border-gray-200 p-3 rounded-2xl rounded-tl-none text-sm text-dark shadow-sm">
                                        Olá, {currentUser ? currentUser.nome.split(' ')[0] : 'visitante'}! Como nossa equipe de moderação pode te ajudar hoje?
                                    </div>
                                </div>
                                {myTicket?.messages.map((msg, i) => (
                                    <div key={i} className={`flex items-start gap-2 ${msg.sender === 'USER' ? 'justify-end' : ''}`}>
                                        {msg.sender === 'ADMIN' && <div className="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white shrink-0"><i className="ph-bold ph-robot"></i></div>}
                                        <div className={`p-3 rounded-2xl text-sm shadow-sm ${msg.sender === 'USER' ? 'bg-primary text-white rounded-tr-none' : 'bg-white border border-gray-200 text-dark rounded-tl-none'}`}>
                                            {msg.text}
                                            <div className={`text-[10px] mt-1 text-right ${msg.sender === 'USER' ? 'text-white/70' : 'text-gray-400'}`}>{msg.time}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="p-3 border-t border-gray-100 bg-white flex gap-2">
                                <input type="text" value={message} onChange={e => setMessage(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSend()} placeholder="Digite sua dúvida..." className="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-primary" />
                                <button onClick={handleSend} className="w-10 h-10 rounded-xl bg-primary text-white flex items-center justify-center hover:bg-primaryDark transition shrink-0"><i className="ph-bold ph-paper-plane-right"></i></button>
                            </div>
                        </div>
                    ) : (
                        <button onClick={() => setIsOpen(true)} className="w-14 h-14 bg-primary text-white rounded-full flex items-center justify-center shadow-lg shadow-primary/40 hover:scale-110 transition-transform hover:bg-primaryDark border-2 border-white">
                            <i className="ph-fill ph-chat-teardrop-dots text-3xl"></i>
                        </button>
                    )}
                </div>
            );
        };

        // ==========================================
        // 7. CONTROLADOR PRINCIPAL (APP ROUTER)
        // ==========================================
        const AppRoot = () => {
            const { currentView, currentUser, selectedWorkerId, setSelectedWorkerId, selectedClientId, setSelectedClientId } = useAppStore();

            // Router
            let content;
            if (currentView === 'LOGIN') content = <LoginScreen />;
            else if (currentView === 'REGISTER') content = <RegisterScreen />;
            else if (selectedWorkerId) content = <WorkerProfileDetail workerId={selectedWorkerId} onBack={() => setSelectedWorkerId(null)} />;
            else if (selectedClientId) content = <ClientProfileDetail clientId={selectedClientId} onBack={() => setSelectedClientId(null)} />;
            else if (currentView === 'HOME') content = <HomeContratante onSelectWorker={setSelectedWorkerId} />;
            else if (currentView === 'ORDERS') content = <ClientOrders />;
            else if (currentView === 'PROFILE') content = <ProfileUser />;
            else if (currentView === 'WORKER_DASH') content = <WorkerDashboard />;
            else if (currentView === 'WORKER_SERVICES') content = <WorkerServicesCRUD />;
            else if (currentView === 'WORKER_HISTORY') content = <WorkerHistory />;
            else if (currentView === 'WORKER_PROFILE') content = <WorkerProfileEdit />;
            else if (currentView === 'ADMIN_DASH') content = <AdminDashboard />;
            else if (currentView === 'ADMIN_CLIENTS') content = <AdminClients />;
            else if (currentView === 'ADMIN_WORKERS') content = <AdminWorkers />;
            else if (currentView === 'ADMIN_APPROVALS') content = <AdminApprovals />;
            else if (currentView === 'ADMIN_SUPPORT') content = <AdminSupport />;
            else if (currentView === 'ADMIN_CHATS') content = <AdminChats />;

            // Guest role fallback for nav
            const navRole = currentUser ? currentUser.role : 'CONTRATANTE';
            const hideNav = currentView === 'LOGIN' || currentView === 'REGISTER' || selectedWorkerId;

            return (
                <div className="min-h-screen bg-[#F9FAFB] flex flex-col font-sans relative overflow-hidden">
                    {/* Background decorativo */}
                    <div className="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
                    <div className="absolute bottom-[20%] right-[-10%] w-[600px] h-[600px] bg-orange-500/5 rounded-full blur-[120px] pointer-events-none"></div>

                    <ToastNotification />

                    {!hideNav && <NavBar role={navRole} />}

                    <main className={`flex-1 w-full relative ${!hideNav ? 'md:pt-20' : ''} pb-10`}>
                        {content}
                    </main>

                    <SupportWidget />

                    <footer className="mt-auto bg-white border-t border-gray-100 py-6 text-center px-4 relative z-10 pb-24 md:pb-6">
                        <div className="flex flex-col items-center justify-center gap-1">
                            <div className="text-lg font-extrabold tracking-tight"><span><span className="text-dark">mão</span><span className="text-primary">A</span><span className="text-dark">obra</span></span></div>
                            <p className="text-xs text-gray-400 font-bold uppercase tracking-wide">© 2026 Todos os direitos reservados.</p>
                        </div>
                    </footer>
                </div>
            );
        };

        console.log('AppRoot component created, now rendering...');
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppProvider><AppRoot /></AppProvider>);
        console.log('Render method called.');
    </script>
</body>

</html>

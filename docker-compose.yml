services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: maoaobra
      POSTGRES_PASSWORD: maoaobra
      POSTGRES_DB: maoaobra
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maoaobra -d maoaobra"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
